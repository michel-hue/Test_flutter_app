name: CI                                   # 1
on:                                        # 2
  pull_request:
  push:
    branches: [main]
jobs:                                      # 3
  test:                                    # 4
    runs-on: ubuntu-latest                 # 5
    defaults:
      run:
        working-directory: app             # 6
    steps:                                 # 7
      - uses: actions/checkout@v4          # 8
      - uses: subosito/flutter-action@v2   # 9
        with:
          channel: stable
          cache: true
      - run: flutter pub get               # 10
      - run: flutter analyze               # 11
      - run: flutter test --exclude-tags golden                  # 12