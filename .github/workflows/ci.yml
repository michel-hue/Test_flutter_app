name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:                                         # 1
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage --exclude-tags golden   # 2
      - uses: actions/upload-artifact@v4                      # 3
        with:
          name: coverage
          path: app/coverage/lcov.info

  build:                                                      # 4
    needs: test                                               # 5
    if: github.ref == 'refs/heads/main'                       # 6
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4                           # 7
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release                      # 8
      - uses: actions/upload-artifact@v4                      # 9
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk